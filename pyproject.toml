[project]
name = "ulstruplund-ha"
version = "0.1.0"
description = "Home Assistant custom integration for Ulstruplund"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
